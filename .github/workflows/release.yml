name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release

      - name: Rename APKs
        run: |
          VERSION="${{ github.ref_name }}"
          [ -z "$VERSION" ] && VERSION="v2.1"
          # Streamlined arm64-v8a APK (~41MB) as primary
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "Synco-Android-${VERSION}.apk"
          # Universal full bundle (~120MB)
          cp build/app/outputs/flutter-apk/app-release.apk "Synco-Android-${VERSION}-universal.apk"
          # 32-bit legacy fallback (~38MB)
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "Synco-Android-${VERSION}-armeabi-v7a.apk"

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: Synco-Android-*.apk

  release:
    name: Publish Release
    needs: [build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Synco ${{ github.ref_name }} - Engine Initialization & Streamlined UI
          draft: false
          prerelease: false
          body: |
            ## 🚀 Synco ${{ github.ref_name }} Release

            ### ⚡ What's New & Resolved in v2.1:
            - **Extractor Engine Initialization Fixed**: Native engine is initialized directly via custom `SyncoApp` (`Application.onCreate()`) with strict ProGuard keep-rules, preventing R8 obfuscation and eliminating the "instance not initialized" error.
            - **66% Reduced APK File Size**: Streamlined primary APK to **~41 MB** (`arm64-v8a`), optimized for modern Android smartphones.
            - **Ultra-Clean Header**: Removed the secondary "Media Suite v2" subtitle on the home screen; centered and lowered the brand title with polished Apple typography.
            - **Dynamic Version Detection**: Replaced hardcoded version strings with `package_info_plus` to dynamically detect and report the exact installed build.
            - **Full Universal Media Support**: YouTube, Instagram, Facebook, X (Twitter), Reddit, TikTok, SoundCloud, Spotify, and 1,000+ sources.

            ### 📦 Download Assets:
            - 📱 **Android (Recommended / Fast ~41MB)**: `Synco-Android-${{ github.ref_name }}.apk`
            - 🌐 **Android Universal (All Architectures ~120MB)**: `Synco-Android-${{ github.ref_name }}-universal.apk`
          files: |
            Synco-Android-*.apk
