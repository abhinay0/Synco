name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android ARM64 Release APK (Streamlined ~41MB)
        run: flutter build apk --release --target-platform android-arm64

      - name: Package Primary ARM64 APK
        run: |
          VERSION="${{ github.ref_name }}"
          [ -z "$VERSION" ] && VERSION="v2.1"
          cp build/app/outputs/flutter-apk/app-release.apk "Synco-Android-${VERSION}.apk"

      - name: Build Android Universal Release APK (All Architectures)
        run: flutter build apk --release

      - name: Package Universal APK
        run: |
          VERSION="${{ github.ref_name }}"
          [ -z "$VERSION" ] && VERSION="v2.1"
          cp build/app/outputs/flutter-apk/app-release.apk "Synco-Android-${VERSION}-universal.apk"

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: Synco-Android-*.apk

  release:
    name: Publish Release
    needs: [build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Synco ${{ github.ref_name }} - Background Downloads, Music Mode & Apple Music Support
          draft: false
          prerelease: false
          body: |
            ## 🚀 Synco ${{ github.ref_name }} Release

            ### ⚡ What's New & Resolved in this Version:
            - **Persistent Background Downloading**: Active and queued downloads now run seamlessly in the background when you exit to the home screen or switch apps, backed by an Android `ForegroundService` and partial `WakeLock`. Eliminates `[Errno 7] No address associated with hostname`.
            - **Top Mode Switcher (Videos vs Music / MP3)**: Added a sleek Apple-styled segmented switcher at the top. Toggle to `Music / MP3` for instant 1-tap downloading with embedded high-resolution album artwork and clean metadata.
            - **Full Apple Music & Spotify Integration**: Paste any Apple Music or Spotify song, album, or playlist link to resolve track metadata and download high-quality MP3s with full cover art and ID3 tags.
            - **CLI Option Parsing Fix**: Eliminated the `--parse-metadata --parse-metadata` argument bug by pairing options and values correctly for native `yt-dlp`.
            - **In-App Self-Updater**: Fully verified update checker and installer. When a new release is available, you can update directly within the app without reinstalling.

            ### 📦 Download Assets:
            - 📱 **Android (Primary ARM64 ~41MB)**: `Synco-Android-${{ github.ref_name }}.apk`
            - 🌐 **Android Universal (~120MB)**: `Synco-Android-${{ github.ref_name }}-universal.apk`
          files: |
            Synco-Android-*.apk
