name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          VERSION="${{ github.ref_name }}"
          [ -z "$VERSION" ] && VERSION="v2.0.1"
          cp build/app/outputs/flutter-apk/app-release.apk "Synco-Android-${VERSION}.apk"

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: Synco-Android-*.apk

  build-windows:
    name: Build Windows App
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Package Windows Zip
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}"
          if (-not $ver) { $ver = "v2.0.1" }
          $zipName = "Synco-Windows-$ver.zip"
          if (Test-Path "build\windows\x64\runner\Release") {
            Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath $zipName
          } else {
            Compress-Archive -Path "build\windows\runner\Release\*" -DestinationPath $zipName
          }

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: Synco-Windows-*.zip

  build-macos:
    name: Build macOS DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build macOS Release
        run: flutter build macos --release

      - name: Package macOS DMG
        run: |
          VERSION="${{ github.ref_name }}"
          [ -z "$VERSION" ] && VERSION="v2.0.1"
          mkdir -p dmg_root
          cp -R build/macos/Build/Products/Release/synco.app dmg_root/Synco.app
          ln -s /Applications dmg_root/Applications
          hdiutil create -volname "Synco v2" -srcfolder dmg_root -ov -format UDZO "Synco-macOS-${VERSION}.dmg"

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: Synco-macOS-*.dmg

  release:
    name: Publish Release
    needs: [build-android, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-zip

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Synco ${{ github.ref_name }} - Embedded Engine & Seamless In-App Updater
          draft: false
          prerelease: false
          body: |
            ## 🚀 Synco ${{ github.ref_name }} Update

            ### ⚡ What's New & Resolved in this Version:
            - **Native `youtubedl-android` Integration**: Fixed `process exited with code 127` on Android by embedding native CPython, `yt-dlp`, FFmpeg, and `aria2c` binaries.
            - **Universal Media Platform Support**: Full downloads & metadata resolution across **YouTube, Instagram, Facebook, X (Twitter), Reddit, TikTok, SoundCloud, Twitch, Vimeo, Bilibili**, and 1,000+ sites.
            - **Seamless In-App Self-Updater**: Added in-app update checks; tap "Update" to download the new version and update directly in-place without needing to uninstall first.
            - **Live yt-dlp Engine Updater**: Update the internal extractor core directly from Settings anytime social media platforms change their algorithms.
            - **Apple Fluid UI**: Spring physics sheets, frosted glass materials, and tactile progress rings.

            ### 📦 Download Assets:
            - 📱 **Android**: `Synco-Android-${{ github.ref_name }}.apk`
            - 🍏 **macOS**: `Synco-macOS-${{ github.ref_name }}.dmg`
            - 🪟 **Windows**: `Synco-Windows-${{ github.ref_name }}.zip`
          files: |
            Synco-Android-*.apk
            Synco-macOS-*.dmg
            Synco-Windows-*.zip
