name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_name: Synco-Linux
            asset_name: Synco-Linux.zip
            build_args: linux
          - os: windows-latest
            artifact_name: Synco-Windows
            asset_name: Synco-Windows.zip
            build_args: windows
          - os: macos-latest
            artifact_name: Synco-macOS
            asset_name: Synco-macOS.dmg
            build_args: macos

    steps:
      - uses: actions/checkout@v3

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Install dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
           # python3 is usually pre-installed
           echo "Ready to build"

      - name: Get dependencies
        run: flutter pub get

      - name: Build App
        run: flutter build ${{ matrix.build_args }} --release

      # Packaging Steps
      
      - name: Package Windows
        if: matrix.os == 'windows-latest'
        run: |
          Compress-Archive -Path build\windows\runner\Release\* -DestinationPath ${{ matrix.asset_name }}

      - name: Package Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd build/linux/x64/release/bundle
          zip -r ../../../../../${{ matrix.asset_name }} .

      - name: Package macOS
        if: matrix.os == 'macos-latest'
        run: |
          # Use create-dmg (available on GitHub Actions macos runners usually, or install it)
          brew install create-dmg
          create-dmg \
            --volname "Synco Installer" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "Synco.app" 200 190 \
            --hide-extension "Synco.app" \
            --app-drop-link 600 185 \
            "${{ matrix.asset_name }}" \
            "build/macos/Build/Products/Release/synco.app"

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.asset_name }}
