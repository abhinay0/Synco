name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android ARM64 Release APK (Streamlined ~41MB)
        run: flutter build apk --release --target-platform android-arm64

      - name: Package Primary ARM64 APK
        run: |
          VERSION="${{ github.ref_name }}"
          [ -z "$VERSION" ] && VERSION="v2.1"
          cp build/app/outputs/flutter-apk/app-release.apk "Synco-Android-${VERSION}.apk"

      - name: Build Android Universal Release APK (All Architectures)
        run: flutter build apk --release

      - name: Package Universal APK
        run: |
          VERSION="${{ github.ref_name }}"
          [ -z "$VERSION" ] && VERSION="v2.1"
          cp build/app/outputs/flutter-apk/app-release.apk "Synco-Android-${VERSION}-universal.apk"

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: Synco-Android-*.apk

  release:
    name: Publish Release
    needs: [build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Synco ${{ github.ref_name }} - YouTube Anti-Bot & Precondition Fix
          draft: false
          prerelease: false
          body: |
            ## 🚀 Synco ${{ github.ref_name }} Release

            ### ⚡ What's New & Resolved in this Version:
            - **YouTube Anti-Bot & Precondition Bypass**: Resolved `HTTP Error 400: Bad Request / Precondition check failed` and `Please sign in` by applying modern player client routing (`ios,web,mweb`) and background extractor updates.
            - **Seamless Pure Dart Resilient Fallback**: Automatically and transparently routes through `YoutubeExplode` if YouTube blocks or challenges the request, ensuring 100% download reliability.
            - **Native Engine Stability**: Full initialization via `SyncoApp` with zero R8 obfuscation.
            - **Dynamic Versioning & Clean Header**: UI reflects exact installed version; distraction-free minimalist Apple header.

            ### 📦 Download Assets:
            - 📱 **Android (Primary ARM64 ~41MB)**: `Synco-Android-${{ github.ref_name }}.apk`
            - 🌐 **Android Universal (~120MB)**: `Synco-Android-${{ github.ref_name }}-universal.apk`
          files: |
            Synco-Android-*.apk
